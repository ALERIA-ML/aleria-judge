# docker compose up -d && docker compose logs -f
#
# BF16 on the lean engine by default. Images cost 562 prompt tokens each (560 soft tokens).
#
# Builds the image, downloads the chosen checkpoint (pinned revision) into ~/.cache/huggingface
# on first start, then serves the playground and the API at http://localhost:30104 from GPU 0.
#
#   ENGINE=lean       one tree forward per pass, BF16 only (default)
#   ENGINE=trt        TensorRT-LLM, as in 1.0.1; its KV cache takes CACHE_FRACTION (70%) of free memory
#
#   CHECKPOINT=bf16   google/gemma-4-31B-it, BF16, about 62 GB (default; any GPU with 80 GB+)
#   CHECKPOINT=nvfp4  nvidia/Gemma-4-31B-IT-NVFP4, about 33 GB (Blackwell); needs ENGINE=trt and VISION=false
#
# Requests pick their effort (low, medium, high) with the X-Decision-Effort header or
# options.effort; DEFAULT_EFFORT applies when they name none (high).
#
# Every setting has a default. Override any of them from the shell (or an optional .env):
#   GPU=2 PORT=8080 docker compose up -d
#   ENGINE=trt CHECKPOINT=nvfp4 VISION=false docker compose up -d
#   MODEL_DIR=/models/gemma-4-31B-it docker compose up -d    # weights you already have
name: aleria-judge
services:
  server:
    build: .
    image: aleria-judge:1.1.1
    init: true
    read_only: true
    network_mode: host
    shm_size: 2gb
    restart: on-failure:3
    gpus:
      - driver: nvidia
        device_ids: ["${GPU:-0}"]
    environment:
      JUDGE_ENGINE: ${ENGINE:-lean}        # lean (one tree forward per pass) or trt (TensorRT-LLM)
      JUDGE_CHECKPOINT: ${CHECKPOINT:-bf16}
      JUDGE_DEFAULT_EFFORT: ${DEFAULT_EFFORT:-high}
      JUDGE_HOST: ${HOST:-127.0.0.1}      # 0.0.0.0 to accept remote clients (set API_KEY too)
      JUDGE_PORT: ${PORT:-30104}
      JUDGE_VISION: ${VISION:-true}        # false: text only
      JUDGE_IMAGE_SOFT_TOKENS: ${IMAGE_SOFT_TOKENS:-560} # per image: 70, 140, 280, 560 (vision board) or 1120 (native)
      JUDGE_CONTEXT_LENGTH: ${CONTEXT_LENGTH:-0}       # tokens per branch (0: 131072 lean, 65536 trt); longer prompts are refused
      JUDGE_CACHE_FRACTION: ${CACHE_FRACTION:-0.7}     # trt: KV cache share of free GPU memory (text only can use 0.8)
      JUDGE_BRANCH_SLOTS: ${BRANCH_SLOTS:-32}          # trt: branches run at once
      JUDGE_PREFILL_TOKENS: ${PREFILL_TOKENS:-2048}    # trt: prefill chunk; these four: speed and memory only; see docs/deploy.md
      JUDGE_HOST_KV_CACHE_GB: ${HOST_KV_CACHE_GB:-0} # TensorRT-LLM host KV tier in GB: 0 (none) or >= 0.5; see docs/deploy.md
      JUDGE_NVFP4_BACKENDS: ${NVFP4_BACKENDS:-} # nvfp4 only; empty: TensorRT-LLM's Blackwell defaults
      JUDGE_CPU_THREADS: ${CPU_THREADS:-8} # torch CPU threads
      JUDGE_API_KEY: ${API_KEY:-}          # bearer key for /v1/*; empty disables authentication
      HF_TOKEN: ${HF_TOKEN:-}              # optional; a saved `hf auth login` token also works
      HF_HOME: /hf
      XDG_CACHE_HOME: /root/.cache
      TORCH_EXTENSIONS_DIR: /root/.cache/torch_extensions
      TRITON_CACHE_DIR: /root/.cache/triton
      CUDA_CACHE_PATH: /root/.cache/cuda
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/inductor
      TRTLLM_DG_CACHE_DIR: /root/.cache/deepgemm
    volumes:
      # Hugging Face cache: the checkpoint is downloaded here once and reused, as is a login token.
      - ${HF_CACHE:-~/.cache/huggingface}:/hf
      # A checkpoint directory you already have; when it holds no checkpoint, the HF cache is used.
      - ${MODEL_DIR:-~/.cache/huggingface}:/model:ro
      # Compilation caches (per checkpoint), the tokenizer and image-budget overlays and temporary files.
      - ${CACHE_DIR:-~/.cache/aleria-judge}/${CHECKPOINT:-bf16}:/root/.cache
      - ${CACHE_DIR:-~/.cache/aleria-judge}/${CHECKPOINT:-bf16}/tmp:/tmp
    logging:
      driver: json-file
      options:
        max-size: 200m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['JUDGE_PORT']+'/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2h
