[project]
name = "aleria-judge"
version = "1.1.1"
description = "Aleria Judge: zero-shot structured decisions from stock Gemma 4 31B on one GPU, read from next-token distributions over several orders of the options."
requires-python = ">=3.11"
license = "Apache-2.0"
# The service runs inside NVIDIA's TensorRT-LLM 1.3.0rc29 release image (Python 3.12), which provides
# tensorrt_llm, torch, transformers, fastapi, uvicorn and prometheus_client; nothing is installed on top.

[project.optional-dependencies]
# Offline tests: exactly the versions in that image, plus pytest.
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "pydantic==2.13.4",
    "prometheus_client==0.26.0",
    "transformers==5.5.4",
    "jinja2==3.1.6",
    "huggingface_hub==1.28.0",
    "pillow==12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
